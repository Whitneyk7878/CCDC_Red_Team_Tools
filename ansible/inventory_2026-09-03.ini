# CCDC Practice Session — 2026-09-03
# Add your VM IPs here before the session
# Set ansible_ssh_pass per host, or put the password in group_vars/all.yml

[linux_targets]
# 192.168.x.x   ansible_user=root   ansible_ssh_pass=YourPasswordHere
# 192.168.x.y   ansible_user=root   ansible_ssh_pass=YourPasswordHere

[linux_targets:vars]
ansible_user=root
ansible_ssh_pass=YourPasswordHere
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
